<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glommyy</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--out:#8fb0ee;--grid:#7ba0e8;--cream:#f8f4ea;--card:#fff;--ink:#111;--ln:#111;--mute:#6b6658;--a:#8fb0ee;--co:#f2694b;--ye:#ffd23f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--out:#1c2440;--grid:#27315a;--cream:#262238;--card:#342f4a;--ink:#f6f1e3;--ln:#f6f1e3;--mute:#b3aac4}}
:root[data-theme="dark"]{--out:#1c2440;--grid:#27315a;--cream:#262238;--card:#342f4a;--ink:#f6f1e3;--ln:#f6f1e3;--mute:#b3aac4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Poppins',system-ui,sans-serif;font-size:.9rem;
background-color:var(--out);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;padding:14px 12px 120px}
.app{max-width:460px;margin:0 auto;background:var(--cream);border:3px solid var(--ln);border-radius:28px;padding:18px 16px 8px;box-shadow:6px 6px 0 var(--ln)}
.disp{font-family:'Abril Fatface',Georgia,serif;font-weight:400}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hi{color:var(--mute);font-size:.85rem}
h1{font-size:2rem;margin:0;line-height:1.1}
h2{font-size:1.25rem;margin:18px 0 10px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--co);outline-offset:2px}
.av{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ln);background:var(--ye);padding:0;overflow:hidden}
.box{background:var(--card);border:2.5px solid var(--ln);border-radius:14px;box-shadow:4px 4px 0 var(--ln);padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.st{border:2.5px solid var(--ln);border-radius:14px;box-shadow:4px 4px 0 var(--ln);padding:12px;color:#111;min-height:118px}
.st .big{font-size:1.9rem;line-height:1.1;word-break:break-word}
.st small{display:block;font-weight:500;margin-top:4px}
.s1{background:var(--a);color:var(--on,#111)}.s2{background:var(--co)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
input,select{width:100%;background:#fff;color:#111;border:2.5px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:10px;box-shadow:2px 2px 0 var(--ln)}
label{font-weight:600;font-size:.8rem;display:block;margin-bottom:5px}
.btn{width:100%;background:var(--ye);color:#111;border:2.5px solid var(--ln);border-radius:10px;padding:10px;font-weight:600;box-shadow:3px 3px 0 var(--ln)}
.btn:active,.nav button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ln)}
.btn.co{background:var(--co)}.btn.w{background:#fff}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:2px dashed var(--ln)}
.li:first-of-type{border-top:0}
.sub{color:var(--mute);font-size:.78rem}
.pos{color:#1d8b4b;font-weight:600}.neg{color:#d23a22;font-weight:600}
.x{background:var(--card);border:2px solid var(--ln);border-radius:8px;width:30px;height:30px;font-weight:600;margin-left:8px;color:var(--ink)}
.bar{height:22px;border:2.5px solid var(--ln);border-radius:12px;background:#fff;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--co) 0 8px,var(--ye) 8px 16px);border-right:2.5px solid var(--ln);transition:width .4s}
.gl{filter:drop-shadow(3px 3px 0 var(--ln));flex:0 0 auto}
.says{display:flex;align-items:center;gap:12px}
.bub{background:#fff;color:#111;border:2.5px solid var(--ln);border-radius:14px;padding:10px 12px;font-weight:500;position:relative}
.bub:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--ln);border-left:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.dow{font-size:.7rem;font-weight:600;color:var(--mute)}
.d{aspect-ratio:1;border:2px solid transparent;border-radius:10px;background:none;font-weight:600;position:relative;color:var(--ink)}
.d.t{border-color:var(--ln)}
.d.s{background:var(--ye);color:#111;border-color:var(--ln);box-shadow:2px 2px 0 var(--ln)}
.dots{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.dots b{width:6px;height:6px;border-radius:50%;border:1.5px solid #111}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sw button{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ln)}
.sw button.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ln)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,92vw);background:var(--card);border:3px solid var(--ln);border-radius:20px;box-shadow:4px 4px 0 var(--ln);display:flex;gap:6px;padding:6px}
.nav button{flex:1;background:none;border-radius:14px;padding:7px 2px;font-weight:600;font-size:.74rem;color:var(--ink);border:2.5px solid transparent}
.nav button span{display:block;font-size:1.2rem}
.nav button.on{background:var(--ye);color:#111;border-color:var(--ln);box-shadow:2px 2px 0 var(--ln)}
dialog{border:3px solid var(--ln);border-radius:20px;background:var(--cream);color:var(--ink);width:min(92vw,400px);padding:18px;box-shadow:6px 6px 0 var(--ln)}
dialog::backdrop{background:rgba(17,17,17,.5)}
.empty{color:var(--mute);padding:4px 0}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.chb{background:var(--card);color:var(--ink);border:2.5px solid var(--ln);border-radius:14px;padding:8px 6px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:3px 3px 0 var(--ln)}
.chb.on{background:var(--ye);color:#111}
.chb:active{transform:translate(3px,3px);box-shadow:none}
.hb{display:flex;gap:8px}.hb .av.sp{background:var(--co);font-size:1.2rem}
.nvs{display:grid;gap:12px;margin-bottom:14px}
.nvb{display:flex;gap:12px;text-align:left;background:var(--card);color:var(--ink);border:2.5px solid var(--ln);border-radius:14px;box-shadow:4px 4px 0 var(--ln);padding:10px;align-items:center}
.nvb:active{transform:translate(3px,3px);box-shadow:none}
.nvc{flex:0 0 72px;height:96px;border:2.5px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--card)}.nvc svg{width:100%;height:100%;display:block}
.nvi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bar.sm{height:10px;margin:6px 0}
.nv{font-family:Georgia,"Times New Roman",serif;line-height:1.75}
.nv h1{font:400 1.9em/1.15 'Abril Fatface',Georgia,serif;margin:.2em 0}
.nv h2{font:400 1.45em/1.2 'Abril Fatface',Georgia,serif;margin:1.8em 0 .4em}
.nv h2 span{display:block;font:600 .55em Poppins,system-ui,sans-serif;letter-spacing:.2em;color:var(--mute)}
.nv svg{width:100%;height:auto;border:2.5px solid var(--ln);border-radius:12px;display:block;margin:16px 0}
.nv p{margin:0 0 1em}.nv .q{border-left:4px solid var(--co);padding-left:12px;color:var(--mute)}
.nv .cover{text-align:center}.nv .cover small{letter-spacing:.25em;font:600 .62em Poppins,system-ui,sans-serif;color:var(--co)}
.nv .tag{color:var(--mute);font-style:italic}
.nv .cast{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nv .cast div{border:2px solid var(--ln);border-radius:12px;padding:10px;font:.75em/1.4 Poppins,system-ui,sans-serif;background:var(--cream)}
.nv .cast b{display:block;font:400 1.15em 'Abril Fatface',Georgia,serif}.nv .cast em{color:var(--mute)}
.nv .end{border:2.5px solid var(--ln);border-radius:14px;padding:14px;text-align:center;background:var(--cream)}
@keyframes bm{0%,100%{opacity:.35}50%{opacity:1}}.nv .beam{animation:bm 3s infinite}
@media(max-width:420px){.nv .cast{grid-template-columns:1fr}}
.nav button{font-size:.66rem}
.nvb{cursor:pointer;position:relative}.nvcv{position:absolute;right:8px;top:8px;margin:0}
.cmr{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}.cmc{flex:0 0 auto;background:var(--card);color:var(--ink);border:2.5px solid var(--ln);border-radius:12px;padding:8px 12px;font-weight:600;box-shadow:3px 3px 0 var(--ln)}.cmc.on{background:var(--ye);color:#111}
.cmi{padding:10px 0;border-top:2px dashed var(--ln)}.cmi:first-child{border-top:0}.cmh{display:flex;justify-content:space-between;gap:10px}.cmi.b .bar i{background:#2bb36a}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ye);color:#111;border:2.5px solid var(--ln);border-radius:12px;padding:8px 14px;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}#toast.on{opacity:1}
.nav{gap:3px}.nav button{font-size:.58rem}</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="hi" id="hi"></div><h1 class="disp" id="ttl"></h1></div>
  <div class="hb"><button class="av sp" id="sup" aria-label="Support Creator">♥</button><button class="av" id="set" aria-label="Pengaturan"></button></div>
</header>
<main id="main"></main>
</div>
<div class="nav" id="tabs"></div>

<dialog id="dlg">
  <h2 class="disp" style="margin-top:0">Pengaturan</h2>
  <label>Nama kamu</label><input id="sName">
  <label>Karakter</label><div class="chars" id="chars"></div>
  <label>Tampilan</label>
  <select id="sTheme"><option value="auto">Ikuti perangkat</option><option value="light">Terang</option><option value="dark">Gelap</option></select>
  <label>Pencarian Google (opsional)</label><input id="sGk" placeholder="API key Google"><input id="sGc" placeholder="Search engine ID (cx)"><div class="sub" style="margin:-4px 0 12px">Tanpa ini, pencarian memakai Wikipedia &amp; DuckDuckGo. Kunci hanya disimpan di perangkat ini.</div><label>Simpan progress</label><div class="box" style="padding:10px;margin-bottom:12px"><div class="sub" id="svS"></div><div class="row" style="margin-top:8px"><button class="btn w" id="svNow" type="button">💾 Simpan</button><button class="btn w" id="svEx" type="button">⬇️ Cadangan</button></div><button class="btn w" id="svIm" type="button" style="margin-top:8px">⬆️ Pulihkan dari cadangan</button><input type="file" id="svF" accept=".json,application/json" hidden></div>
  <div class="row"><button class="btn w" id="sCancel">Tutup</button><button class="btn" id="sSave">Simpan</button></div>
</dialog>

<dialog id="dlg2"><div id="d2"></div></dialog>

<script>
const PAL=['#7c63dd','#8fb0ee','#c9b8f5','#9be3c1','#ffb3c7','#ffd23f','#ffa86b'];
const CHARS={glommyy:{name:'Glommyy',accent:'#7c63dd'},tumbi:{name:'Tumbi',accent:'#2bb3a0'},carty:{name:'Carty',accent:'#3aa8e0'},orbi:{name:'Orbi',accent:'#ff7a52'}};
const EVC=['#f2694b','#8fb0ee','#c9b8f5','#ffd23f','#7ed9a6','#ff9ec0'];
const CONDS={cerah:'☀️ Cerah',berawan:'⛅ Berawan',mendung:'☁️ Mendung',hujan:'🌧️ Hujan',badai:'⛈️ Badai',berkabut:'🌫️ Berkabut'};
const MOOD={cerah:'joy',berawan:'happy',mendung:'sad',hujan:'sad',badai:'sad',berkabut:'peek'};
const SAY={cerah:'Cerah banget! Pakai topi ya.',berawan:'Berawan, enak buat jalan santai.',mendung:'Mendung nih… bawa jaket ya.',hujan:'Hujan! Jangan lupa payung.',badai:'Badai! Mending di rumah dulu.',berkabut:'Berkabut, hati-hati di jalan.'};
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DEF={name:'',title:'Glommyy',accent:PAL[0],theme:'auto',tab:'w',weather:[],pig:{goal:'Tabungan impian',target:1000000,tx:[]},events:{}};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('catatan')||'{}'))}catch(e){S=Object.assign({},DEF)}
if(S.title==='Catatan Harian')S.title='Glommyy';
if(!S.v){S.v=2;if(S.accent==='#8fb0ee')S.accent=PAL[0]}
delete S.user;if(!CHARS[S.char])S.char='glommyy';S.accent=CHARS[S.char].accent;S.title=CHARS[S.char].name;
const save=()=>{try{S.savedAt=Date.now();localStorage.setItem('catatan',JSON.stringify(S));return true}catch(e){toast('Penyimpanan penuh. Unduh cadangan lalu hapus sampul gambar yang besar.');return false}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date();
let view=new Date(today.getFullYear(),today.getMonth(),1),sel=iso(today);

/* Glommyy: kucing ungu bulat dengan 6 pose (sapa, senang, tidur, bingung, mengintip, bawa bendera) */
const OL='#2b1d5e',YE='#ffc93c',PK='#ff8fa3',CR='#fff0d6';
const mix=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const c=[1,3,5].map(i=>{const v=parseInt(h.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const SW=`stroke="${OL}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
const limb=(d,c)=>`<path d="${d}" fill="none" stroke="${OL}" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>`;
const star=(x,y,R,r)=>{const p=[];for(let i=0;i<10;i++){const a=(-90+i*36)*Math.PI/180,q=i%2?r:R;p.push((x+q*Math.cos(a)).toFixed(1)+','+(y+q*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${YE}" stroke="${OL}" stroke-width="1.5" stroke-linejoin="round"/>`};
const spark=(x,y,k)=>`<path transform="translate(${x} ${y}) scale(${k})" d="M0-4.5L1.2-1.2L4.5 0L1.2 1.2L0 4.5L-1.2 1.2L-4.5 0L-1.2-1.2Z" fill="${YE}" stroke="${OL}" stroke-width="1.1" stroke-linejoin="round"/>`;
const eye=(dx,dy)=>[39,61].map(x=>`<circle cx="${x}" cy="50.5" r="6.8" fill="#fff" stroke="${OL}" stroke-width="1.8"/><circle cx="${x+dx}" cy="${50.5+dy}" r="3.7" fill="${OL}"/><circle cx="${x+dx+1.3}" cy="${50.5+dy-1.4}" r="1.2" fill="#fff"/>`).join('');
const arcs=(up)=>`<path d="${up?'M33 51.5Q38.5 43.5 44 51.5M56 51.5Q61.5 43.5 67 51.5':'M33.5 49.5Q39 55 44.5 49.5M55.5 49.5Q61 55 66.5 49.5'}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
const NOSE=`<ellipse cx="50" cy="57.3" rx="2.3" ry="1.7" fill="${PK}" stroke="${OL}" stroke-width="1.2"/>`;
const CHEEK=`<ellipse cx="30.5" cy="59.2" rx="4.4" ry="3" fill="${PK}"/><ellipse cx="69.5" cy="59.2" rx="4.4" ry="3" fill="${PK}"/>`;
const MT={
open:`<path d="M43.6 59.6H56.4Q55.2 66.6 50 66.6Q44.8 66.6 43.6 59.6Z" fill="#c0235a" stroke="${OL}" stroke-width="1.4" stroke-linejoin="round"/><path d="M44.4 59.8h1.8l-.9 2.6zM55.6 59.8h-1.8l.9 2.6z" fill="#fff"/><ellipse cx="50" cy="66.2" rx="3.2" ry="1.3" fill="${PK}"/>`,
big:`<path d="M42.6 59.4H57.4Q55.6 68.2 50 68.2Q44.4 68.2 42.6 59.4Z" fill="#c0235a" stroke="${OL}" stroke-width="1.4" stroke-linejoin="round"/><path d="M43.4 59.6h2l-1 2.8zM56.6 59.6h-2l1 2.8z" fill="#fff"/><ellipse cx="50" cy="67.6" rx="4" ry="1.5" fill="${PK}"/>`,
smile:`<path d="M45.2 60.4H54.8Q54 64.8 50 64.8Q46 64.8 45.2 60.4Z" fill="#c0235a" stroke="${OL}" stroke-width="1.3" stroke-linejoin="round"/>`,
o:`<ellipse cx="50" cy="61.4" rx="1.7" ry="2" fill="#c0235a" stroke="${OL}" stroke-width="1.2"/>`,
wavy:`<path d="M44.6 62q1.9-2.2 3.8 0t3.8 0t3.8 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>`};
const ALIAS={cool:'flag',star:'joy'};
function GG(m,s){
  m=ALIAS[m]||m;
  const A=CHARS.glommyy.accent,D=mix(A,'#241552',.34),L=mix(A,'#ffffff',.14);
  const tail=limb('M79 62Q89 56.5 91 66Q92 77 77 78.5',A);
  const feet=`<ellipse cx="39" cy="86" rx="8" ry="4.2" fill="${D}" ${SW}/><ellipse cx="61" cy="86" rx="8" ry="4.2" fill="${D}" ${SW}/>`;
  const head=`<path d="M27 20.5L43.5 30.5L30 38.5Z" fill="${A}" ${SW}/><path d="M73 20.5L56.5 30.5L70 38.5Z" fill="${A}" ${SW}/><path d="M30.6 26L38.5 30.4L31.8 33.2Z" fill="${PK}"/><path d="M69.4 26L61.5 30.4L68.2 33.2Z" fill="${PK}"/>
  <path d="M50 32Q48.4 24 51 17.5" fill="none" stroke="${OL}" stroke-width="1.9" stroke-linecap="round"/>${star(51,12,5,2.3)}`;
  const body=`<ellipse cx="50" cy="58" rx="30" ry="27" fill="${A}" ${SW}/><ellipse cx="50" cy="74.5" rx="15.5" ry="9.5" fill="${CR}"/><ellipse cx="50" cy="52.5" rx="24" ry="15.5" fill="${D}"/>`;
  const dot=x=>`<circle cx="${x}" cy="48.7" r="1.2" fill="${CR}"/>`;
  const hang=`<ellipse cx="17.5" cy="67" rx="4.6" ry="6.4" transform="rotate(15 17.5 67)" fill="${L}" ${SW}/><ellipse cx="82.5" cy="67" rx="4.6" ry="6.4" transform="rotate(-15 82.5 67)" fill="${L}" ${SW}/>`;
  let back='',face='',front='',legs=feet;
  if(m==='happy'){
    back=tail;
    face=eye(0,.3)+NOSE+MT.open+CHEEK;
    front=limb('M24 69Q15.5 64 15.8 56L16 50',A)+dot(16)
      +`<path d="M10.5 41.5L8.8 38M15 40V35M19.5 41.5L21.2 38" stroke="${OL}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`
      +limb('M64.5 68Q70 66.5 74 71',A)
      +`<path d="M79.5 62.5L88.5 69.5L84.3 70L86.8 75.5L84.2 76.6L81.8 71.2L79.2 73.8Z" fill="${YE}" stroke="${OL}" stroke-width="1.4" stroke-linejoin="round"/>`;
  }else if(m==='joy'){
    back=`<ellipse cx="50" cy="96.5" rx="22" ry="2.8" fill="${mix(A,'#ffffff',.6)}" opacity=".6"/>`+tail;
    face=arcs(true)+NOSE+MT.big+CHEEK;
    front=limb('M24 68.5Q15 63 16 55L16.8 48',A)+dot(16.8)+limb('M76 68.5Q85 63 84 55L83.2 48',A)+dot(83.2)
      +spark(6,33,1)+spark(94,27,1)+spark(90,90,.8);
  }else if(m==='sleep'){
    face=arcs(false)+NOSE+MT.o+CHEEK;
    front=hang+`<text x="77" y="20" font-size="9" font-weight="700" fill="${OL}" font-family="Poppins,sans-serif">z</text><text x="85" y="12" font-size="6.5" font-weight="700" fill="${OL}" font-family="Poppins,sans-serif">z</text>`;
  }else if(m==='sad'){
    face=eye(1.3,-1.6)+`<path d="M32.5 43.5L44 41M56 41L67.5 43.5" fill="none" stroke="${OL}" stroke-width="1.9" stroke-linecap="round"/>`+NOSE+MT.wavy+CHEEK;
    front=hang+`<path d="M84 25Q89 32.5 84 37.5Q79 32.5 84 25Z" fill="#7dd3fc" stroke="${OL}" stroke-width="1.5" stroke-linejoin="round"/>`;
  }else if(m==='peek'){
    legs='';
    face=eye(-1.9,1.2)+NOSE;

  }
  navigator.geolocation.getCurrentPosition(
    p=>liveAt(p.coords.latitude,p.coords.longitude).then(()=>end(),()=>end('Gagal mengambil data. Cek internet.')),
    ()=>ipSync().then(()=>end('Izin lokasi tidak diberikan, jadi dipakai perkiraan lokasi dari koneksi internet. Aktifkan lokasi untuk hasil lebih akurat.'),()=>end('Lokasi tidak tersedia. Ketik nama kota lalu tekan "Pakai kota ini".')),
    {timeout:10000,maximumAge:600000});
}
function openWx(){
  const ua=navigator.userAgent;
  if(/iPhone|iPad|iPod/.test(ua)){location.href='weather://';return}
  if(/Android/.test(ua)){
    location.href='intent://#Intent;package=com.sec.android.daemonapp;end';
    setTimeout(()=>{if(!document.hidden)location.href='https://www.google.com/search?q=cuaca+sekarang'},1200);
    return;
  }
  window.open('https://www.google.com/search?q=cuaca+sekarang','_blank');
}

function weather(){
  const w=S.weather,V=S.live,l=V||w[0];
  let h='';
  if(l){
    const [e,n]=CONDS[l.cond].split(' ');
    h+=`<div class="stats"><div class="st s1"><div class="big disp">${l.temp}°C</div><small>${esc(l.city)} · ${V?'otomatis '+hhmm(V.t):esc(l.date)}</small></div>
    <div class="st s2"><div class="big disp">${e}</div><small>${n}</small></div></div>`;
    if(V)h+=`<div class="sub" style="margin:-4px 2px 12px">Terasa ${V.feels}° · Lembap ${V.hum}% · Angin ${V.wind} km/j</div>`;
    h+=says(MOOD[l.cond],SAY[l.cond]);
  }else h+=says('sleep','Halo! Ambil cuaca otomatis atau catat sendiri di bawah ya.');
  h+=`<h2 class="disp">Cuaca otomatis</h2><div class="box">
  <div class="row"><button class="btn" id="wg">📍 Pakai lokasi HP</button><button class="btn w" id="wo">Buka app Cuaca</button></div>
  <div class="sub" id="wm" style="margin-top:8px"></div>
  <div class="sub" style="margin-top:6px">Cuaca diambil otomatis sesuai lokasi pengunjung yang membuka halaman ini, lalu dicatat ke riwayat (satu catatan per kota per hari, diperbarui terus). Data dari Open-Meteo, jadi angkanya bisa beda tipis dengan app Cuaca bawaan karena sumber datanya berbeda.</div></div>
  <h2 class="disp">Catat cuaca</h2><div class="box">
  <label>Kota</label><input id="wc" value="${l?esc(l.city):''}" placeholder="Contoh: Jakarta">
  <button class="btn w" id="wk2" style="margin-bottom:10px">Pakai kota ini</button>
  <div class="row"><div><label>Suhu °C</label><input id="wt" type="number" value="${V?V.temp:''}" placeholder="30"></div><div><label>Kondisi</label><select id="wk">${Object.entries(CONDS).map(([k,v])=>`<option value="${k}"${V&&V.cond===k?' selected':''}>${v}</option>`).join('')}</select></div></div>
  <button class="btn" id="wa">Catat manual</button></div>
  <h2 class="disp">Riwayat</h2><div class="box">`+(w.length?w.slice(0,7).map((x,i)=>`<div class="li"><span>${CONDS[x.cond].split(' ')[0]} <b>${esc(x.city)}</b><br><span class="sub">${esc(x.date)}${x.time?' · '+x.time:''}${x.auto?(x.src==='ip'?' · perkiraan lokasi':' · lokasi HP'):''}</span></span><span><b>${x.temp}°</b><button class="x" data-d="${i}" aria-label="Hapus">✕</button></span></div>`).join(''):'<div class="empty">Belum ada catatan.</div>')+'</div>';
  $('main').innerHTML=h;
  $('wg').onclick=()=>sync('gps');
  $('wk2').onclick=()=>sync('city');
  $('wo').onclick=openWx;
  $('wa').onclick=()=>{
    const city=$('wc').value.trim(),t=$('wt').value;
    if(!city||t==='')return;
    S.weather.unshift({city,temp:+t,cond:$('wk').value,date:today.getDate()+' '+MONTHS[today.getMonth()]});
    S.weather=S.weather.slice(0,30);save();render();
  };
  $('main').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.weather.splice(+b.dataset.d,1);save();render()});
}

function piggy(){
  const P=S.pig,tot=P.tx.reduce((a,x)=>a+x.amt,0),pct=P.target>0?Math.max(0,Math.min(100,tot/P.target*100)):0;
  const m=tot<=0?'sleep':pct>=100?'star':pct>=50?'cool':'happy';
  const t=tot<=0?'Celenganku masih kosong… yuk isi!':pct>=100?'Target tercapai! Horeee!':pct>=50?'Sedikit lagi, kamu keren!':'Lumayan! Terus semangat.';
  let h=`<div class="stats"><div class="st s1"><div class="big disp">${rp(tot)}</div><small>Terkumpul</small></div>
  <div class="st s2"><div class="big disp">${rp(Math.max(0,P.target-tot))}</div><small>Sisa target</small></div></div>
  <div class="box"><div class="disp" style="font-size:1.2rem">${esc(P.goal)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub">${Math.round(pct)}% dari ${rp(P.target)}</div></div>`+says(m,t)+`
  <h2 class="disp">Isi celengan</h2><div class="box">
  <input id="pa" type="number" inputmode="numeric" placeholder="Jumlah (Rp)">
  <input id="pn" placeholder="Catatan (opsional)">
  <div class="row"><button class="btn" id="pin">+ Menabung</button><button class="btn co" id="pout">− Ambil</button></div></div>
  <h2 class="disp">Ubah tujuan</h2><div class="box">
  <label>Nama tujuan</label><input id="pg" value="${esc(P.goal)}"><label>Target (Rp)</label><input id="pt" type="number" inputmode="numeric" value="${P.target}">
  <button class="btn w" id="ps">Simpan tujuan</button></div>
  <h2 class="disp">Riwayat</h2><div class="box">`+(P.tx.length?P.tx.slice().reverse().slice(0,30).map(x=>`<div class="li"><span>${esc(x.note||(x.amt>0?'Menabung':'Ambil'))}<br><span class="sub">${esc(x.date)}</span></span><span><span class="${x.amt>0?'pos':'neg'}">${x.amt>0?'+':'−'}${rp(Math.abs(x.amt))}</span><button class="x" data-id="${x.id}" aria-label="Hapus">✕</button></span></div>`).join(''):'<div class="empty">Belum ada transaksi. Mulai menabung hari ini.</div>')+'</div>';
  $('main').innerHTML=h;
  const add=s=>{const a=+$('pa').value;if(!(a>0))return;
    P.tx.push({id:Date.now(),amt:s*a,note:$('pn').value.trim(),date:today.getDate()+' '+MONTHS[today.getMonth()]+' '+today.getFullYear()});save();render()};
  $('pin').onclick=()=>add(1);$('pout').onclick=()=>add(-1);
  $('ps').onclick=()=>{P.goal=$('pg').value.trim()||'Tabungan';P.target=+$('pt').value||0;save();render()};
  $('main').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{P.tx=P.tx.filter(x=>x.id!=b.dataset.id);save();render()});
}

function cal(){
  const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let g=['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)g+='<div></div>';
  for(let d=1;d<=n;d++){
    const k=iso(new Date(y,m,d)),ev=S.events[k]||[];
    g+=`<button class="d ${k===iso(today)?'t':''} ${k===sel?'s':''}" data-k="${k}">${d}<span class="dots">${ev.slice(0,3).map(e=>`<b style="background:${e.c}"></b>`).join('')}</span></button>`;
  }
  const ev=S.events[sel]||[],sd=sel.split('-');
  $('main').innerHTML=`<div class="box"><div class="row" style="margin-bottom:12px;align-items:center"><button class="x" id="pm" style="flex:0 0 36px;height:36px;margin:0">‹</button><div class="disp" style="text-align:center;font-size:1.25rem">${MONTHS[m]} ${y}</div><button class="x" id="nm" style="flex:0 0 36px;height:36px;margin:0">›</button></div><div class="grid">${g}</div></div>`
  +says(ev.length?'happy':'sleep',ev.length?`Ada ${ev.length} agenda di tanggal ini.`:'Belum ada agenda di tanggal ini, santai dulu.')
  +`<h2 class="disp">Agenda ${+sd[2]} ${MONTHS[+sd[1]-1]}</h2><div class="box">`+(ev.length?ev.map((e,i)=>`<div class="li"><span><b style="display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #111;background:${e.c};margin-right:8px"></b>${esc(e.t)}</span><button class="x" data-e="${i}" aria-label="Hapus">✕</button></div>`).join(''):'<div class="empty">Kosong.</div>')+`</div>
  <div class="box"><label>Agenda baru</label><input id="et" placeholder="Contoh: Ulang tahun Rani"><div class="sw" id="ec">${EVC.map((c,i)=>`<button style="background:${c}" data-c="${c}" class="${i===0?'on':''}" aria-label="Warna"></button>`).join('')}</div><button class="btn" id="ea">Simpan agenda</button></div>`;
  let col=EVC[0];
  $('ec').querySelectorAll('button').forEach(b=>b.onclick=()=>{col=b.dataset.c;$('ec').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('pm').onclick=()=>{view=new Date(y,m-1,1);render()};
  $('nm').onclick=()=>{view=new Date(y,m+1,1);render()};
  $('main').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel=b.dataset.k;render()});
  $('ea').onclick=()=>{const t=$('et').value.trim();if(!t)return;(S.events[sel]=S.events[sel]||[]).push({t,c:col});save();render()};
  $('main').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.events[sel].splice(+b.dataset.e,1);if(!S.events[sel].length)delete S.events[sel];save();render()});
}

let sRun=false,sBase=9.8,sLast=0;
function stp(){const t=iso(new Date());if(!S.sp||S.sp.d!==t)S.sp=Object.assign({goal:10000,len:75},S.sp,{d:t,n:0});return S.sp}
function sUi(){const s=stp();if(!$('sN'))return;const km=s.n*s.len/100000,p=Math.min(100,s.n/s.goal*100);
 $('sN').textContent=s.n.toLocaleString('id-ID');$('sK').textContent=km.toFixed(2);$('sC').textContent=Math.round(s.n*0.04)+' kkal';$('sB').style.width=p+'%';$('sP').textContent=Math.round(p)+'% dari target '+s.goal.toLocaleString('id-ID')+' langkah'}
function sMo(ev){const a=ev.accelerationIncludingGravity;if(!a)return;const m=Math.hypot(a.x||0,a.y||0,a.z||0);sBase=sBase*.9+m*.1;const n=Date.now();if(m-sBase>1.8&&n-sLast>320){sLast=n;stp().n++;sUi();if(stp().n%20===0)save()}}
function steps(){const s=stp(),p=Math.min(100,s.n/s.goal*100);
 $('main').innerHTML=`<div class="stats"><div class="st s1"><div class="disp big" id="sN"></div><small>Langkah hari ini</small></div><div class="st s2"><div class="disp big" id="sK"></div><small>Kilometer</small></div></div>
 ${says(p>=100?'joy':'happy',p>=100?'Target tercapai! Hebat banget!':'Ayo jalan, aku temenin!')}
 <div class="box"><div class="bar"><i id="sB"></i></div><div class="sub" id="sP"></div><div class="sub" id="sC" style="margin-top:4px"></div></div>
 <div class="box"><div class="row"><button class="btn" id="sGo">${sRun?'Jeda':'Mulai hitung'}</button><button class="btn w" id="sPl">+10</button><button class="btn co" id="sRs">Reset</button></div>
 <div class="row" style="margin-top:12px"><div><label>Target langkah</label><input type="number" id="sTg" value="${s.goal}"></div><div><label>Panjang langkah (cm)</label><input type="number" id="sLn" value="${s.len}"></div></div>
 <div class="sub" id="sM">${sRun?'Menghitung… biarkan halaman tetap terbuka saat berjalan.':'Genggam ponsel atau taruh di saku saat berjalan. Sensor gerak dipakai untuk mendeteksi langkah.'}</div></div>`;
 sUi();
 $('sGo').onclick=async()=>{if(sRun){removeEventListener('devicemotion',sMo);sRun=false;save();return steps()}
  try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission&&await DeviceMotionEvent.requestPermission()!=='granted'){$('sM').textContent='Izin sensor ditolak. Aktifkan izin gerak di pengaturan browser.';return}}catch(e){}
  addEventListener('devicemotion',sMo);sRun=true;steps()};
 $('sPl').onclick=()=>{stp().n+=10;save();sUi()};$('sRs').onclick=()=>{stp().n=0;save();sUi()};
 $('sTg').onchange=()=>{s.goal=Math.max(1,+$('sTg').value||10000);save();sUi()};$('sLn').onchange=()=>{s.len=Math.max(20,+$('sLn').value||75);save();sUi()}}

const NOV=[{"id": "notif", "title": "Notif dari Besok", "meta": "Novel Remaja · Tamat · 11 bab", "c": "#2a1a5e", "cv": {"m": "cus", "c1": "#2a1a5e", "c2": "#9b7bff", "st": "rays", "em": "⏳"}, "html": "<div class=\"cover\"><small>NOVEL REMAJA · TAMAT<\/small><h1>Notif dari Besok<\/h1><p class=\"tag\">Pesan dari masa depan, atau cuma aplikasi yang pandai menebak?<\/p><\/div><div class=\"cast\"><div><b>Raka<\/b>Kelas 11 IPS 2, tokoh utama. <em>Telat terus, lalu menemukan HP aneh.<\/em><\/div><div><b>Bimo<\/b>Sahabat Raka. <em>Jago ngoprek, mulutnya susah dikunci.<\/em><\/div><div><b>Nara<\/b>Pemain basket, 11 IPA 1. <em>Teman baru yang tahu nama Raka.<\/em><\/div><div><b>Aplikasi Besok<\/b>HP ungu dari atap. <em>Mengaku datang dari masa depan.<\/em><\/div><\/div><h2><span>BAB 1<\/span>HP Nemu di Atap Sekolah<\/h2><p>Nama gue Raka, kelas 11 IPS 2. Hidup gue biasa banget: bangun telat, dimarahin Mama, lari ke sekolah, dimarahin guru piket. Ulangi besok.<\/p><p>Sampai Selasa itu.<\/p><p>Jam istirahat, gue kabur ke atap gedung C. Tempat rahasia gue. Cuma ada gue, angin, dan tumpukan kursi rusak. Nah, di balik kursi paling berdebu, ada sesuatu yang berkilat.<\/p><p>Sebuah HP. Layarnya retak, casing-nya hitam polos, nggak ada merek.<\/p><p>“Wih, rezeki,” gumam gue.<\/p><p>Gue pencet tombol samping. Layarnya langsung nyala. Nggak ada kunci layar, nggak ada wallpaper. Cuma satu aplikasi di tengah layar, ikonnya jam pasir warna ungu, namanya <b>Besok.<\/b><\/p><p>Gue ketuk.<\/p><p>Layar berubah jadi kayak aplikasi chat. Ada satu pesan masuk, dari kontak bernama <b>“R. (Lo, Besok)”<\/b>.<\/p><p class=\"q\">Jangan naik angkot 07.15. Percaya aja. Dan jangan lupa bawa payung biru.<\/p><p>Gue bengong. Terus ketawa. “Prank anak kelas sebelah nih.”<\/p><p>Tapi di pojok layar ada tulisan kecil: Pesan ini dikirim 23 jam 41 menit yang lalu... dari masa depan.<\/p><p>Gue matiin HP-nya, masukin tas, dan pura-pura nggak kepikiran. Padahal sepanjang pelajaran Sejarah, jantung gue joget dangdut.<\/p><h2><span>BAB 2<\/span>Payung Biru<\/h2><p>Rabu pagi. Gue berdiri di depan rumah, 07.10. Angkot biasa gue, nomor 14, biasanya lewat jam 07.15.<\/p><p>Di tangan gue ada payung biru milik Mama. Langit cerah banget. Nggak ada tanda hujan sama sekali.<\/p><p>“Ngapain bawa payung, Rak?” tanya Mama.<\/p><p>“Cuma... jaga-jaga.”<\/p><p>Gue ngelirik jam. 07.14. Angkot 14 nongol di tikungan.<\/p><p>Tangan gue mau ngelambai. Tapi gue inget pesan itu. Gue nahan tangan, ngumpet di balik pagar, dan ngebiarin angkot itu lewat.<\/p><p>Gue telat. Jelas. Gue nunggu angkot berikutnya, 07.30, terus sampe sekolah jam delapan kurang. Pak Dedi, guru piket, udah siap dengan tatapan membunuh.<\/p><p>“Raka! Telat lagi!”<\/p><p>Tapi sebelum gue sempat bela diri, anak-anak di depan gerbang rame ngomongin sesuatu.<\/p><p>“Eh, denger nggak? Angkot 14 tadi nabrak tiang listrik di perempatan!”<\/p><p>“Penumpangnya luka-luka, tapi untung nggak ada yang parah!”<\/p><p>Lutut gue lemes. Itu angkot yang harusnya gue naikin.<\/p><p>Pas jam istirahat, hujan turun deras. Padahal pagi tadi cerah banget. Gue buka payung biru itu di lapangan, dan ada satu cewek yang lagi lari-lari kehujanan sambil nutupin kepala pakai buku.<\/p><p>Namanya Nara, anak 11 IPA 1, jago basket, dan sering gue liatin dari jauh. Bukan karena apa-apa. Yah, karena... apa-apa sih.<\/p><p>“Eh,” gue ngomong kenceng, “mau bareng nggak? Gue bawa payung.”<\/p><p>Nara berhenti. Dia ngeliat payung biru itu, terus ngeliat gue, terus senyum.<\/p><p>“Penyelamat banget. Makasih ya, Raka.”<\/p><p>Dia tahu nama gue.<\/p><p>Malamnya gue buka lagi HP misterius itu. Ada pesan baru.<\/p><p class=\"q\">Bagus. Sekarang tugas lo yang paling penting: besok sore, jangan pulang lewat gerbang belakang. Apa pun yang terjadi.<\/p><p>Di bawahnya ada pesan lagi, yang bikin gue merinding:<\/p><p class=\"q\">Dan jangan kasih tau siapa-siapa soal HP ini. Termasuk Nara.<\/p><h2><span>BAB 3<\/span>Sahabat yang Curiga<\/h2><p>Gue punya satu sahabat, Bimo. Anaknya gendut, lucu, dan mulutnya nggak bisa dikunci.<\/p><p>“Lo aneh banget akhir-akhir ini,” kata Bimo di kantin sambil ngunyah bakwan. “Tiba-tiba bawa payung, tiba-tiba selamat dari angkot. Lo dukun ya?”<\/p><p>“Bukan.”<\/p><p>“Terus?”<\/p><p>Gue ragu. Pesan di HP itu udah jelas: jangan kasih tau siapa-siapa. Tapi gue juga nggak tahan nyimpen sendirian.<\/p><p>“Bim,” bisik gue, “kalau gue bilang gue dapet pesan dari diri gue sendiri di masa depan, lo bakal percaya nggak?”<\/p><p>Bimo berhenti ngunyah. Dia natap gue lama banget.<\/p><p>“Nggak,” katanya. “Tapi ceritain aja. Gue suka cerita gila.”<\/p><p>Akhirnya gue ceritain semuanya. Pas selesai, Bimo ngambil HP itu, nge-scroll, terus alisnya naik.<\/p><p>“Rak, ini pesan terakhirnya... 'jangan lewat gerbang belakang'. Berarti sore ini ada sesuatu di sana.”<\/p><p>“Makanya gue nggak mau ke sana.”<\/p><p>“Justru kita harus ke sana,” kata Bimo, matanya berbinar. “Kita ngintip dari jauh. Kalau ada bahaya, kita catat. Kalau nggak, ya udah, kita pulang beli cilok.”<\/p><p>Gue mau nolak. Tapi rasa penasaran itu kayak gatal yang nggak bisa digaruk.<\/p><p>Sore itu, jam empat, gue dan Bimo ngumpet di balik gerobak bakso, ngeliatin gerbang belakang sekolah.<\/p><p>Awalnya sepi. Terus datang tiga cowok berjaket hitam, anak sekolah lain, nenteng tongkat bisbol. Mereka berdiri nunggu seseorang.<\/p><p>Gue menahan napas. Dari gedung olahraga, seorang cewek keluar sambil nenteng tas basket.<\/p><p>Nara.<\/p><p>“Itu mereka nunggu Nara!” bisik Bimo.<\/p><p>Tubuh gue gerak duluan sebelum otak gue sempat mikir.<\/p><h2><span>BAB 4<\/span>Aksi Paling Bodoh Sepanjang Hidup<\/h2><p>Gue lari keluar dari balik gerobak sambil teriak sekeras mungkin.<\/p><p>“NARA! JANGAN KE SANA! ADA POLISI DI DEPAN!”<\/p><p>Tiga cowok berjaket itu kaget. Nara juga. Bimo, yang kebetulan paling pinter di antara kami berdua, langsung nyalain alarm HP-nya sekeras mungkin, suara sirine polisi dari YouTube.<\/p><p>WIU WIU WIU WIU!<\/p><p>“Cabut! Cabut!” teriak salah satu dari mereka. Ketiganya lari ke motor dan ngebut pergi.<\/p><p>Nara berdiri bengong, ngeliatin gue yang ngos-ngosan, nggak keren sama sekali, dengan kemeja keluar dan rambut berantakan.<\/p><p>“Raka? Itu... tadi apa?”<\/p><p>“Eh. Nggak tau. Gue... kebetulan lewat.”<\/p><p>“Kebetulan lewat, sambil bawa sirine polisi?”<\/p><p>“Itu Bimo.”<\/p><p>“Halo,” kata Bimo sambil melambai. “Gue Bimo. Gue yang ngurus sirine.”<\/p><p>Nara ketawa. Ketawanya lepas banget, sampai matanya ikut menyipit. Terus mendadak dia serius.<\/p><p>“Mereka dari SMK sebelah. Gue pernah nolak ngerjain tugas mereka, terus diancem. Gue kira cuma omong doang.”<\/p><p>“Lo harusnya lapor ke guru,” kata gue.<\/p><p>“Iya. Makasih ya.” Dia natap gue lekat-lekat. “Tapi gue penasaran. Kenapa lo bisa tau mereka bakal ada di sini?”<\/p><p>Gue buka mulut, tutup lagi. Rahasia HP itu menggantung di ujung lidah.<\/p><p>HP di saku gue getar.<\/p><p>Gue ngelirik layarnya diam-diam. Pesan baru muncul:<\/p><p class=\"q\">Oke. Sekarang pilihan lo ada dua. Bohong ke Nara, atau jujur. Tapi hati-hati, di salah satu masa depan, HP ini bikin semuanya hancur.<\/p><p>Perut gue mules.<\/p><h2><span>BAB 5<\/span>Pilihan<\/h2><p>Malamnya gue nggak bisa tidur. Gue tiduran sambil mandangin langit-langit kamar, HP ungu itu di dada.<\/p><p>Gue ngetik balasan, pertama kali.<\/p><p>“Lo siapa sebenernya?”<\/p><p>Centang satu. Terus berubah jadi dua. Terus muncul tulisan: sedang mengetik... Jantung gue hampir copot.<\/p><p class=\"q\">Gue elo. Dari tujuh hari lagi.<\/p><p>“Kenapa lo ngirim pesan ke gue?”<\/p><p class=\"q\">Karena di tujuh hari itu, gue kehilangan semuanya. Bimo, Nara, bahkan Mama. Dan semuanya gara-gara HP ini.<\/p><p>Tangan gue gemetar.<\/p><p>“Kok bisa?”<\/p><p class=\"q\">Makin sering lo ngubah masa depan, makin banyak hal yang nggak bisa gue kendaliin. Gue udah salah ngitung. Jadi tolong, dengerin gue. Buang HP ini besok pagi. Jangan tanya kenapa.<\/p><p>Gue nelen ludah. Di satu sisi, gue baru aja nyelametin Nara. Di sisi lain, mungkin itu bukan satu-satunya yang berubah.<\/p><p>Besok paginya gue cerita ke Bimo, kali ini dengan semua detail. Bimo dengerin sambil mengerutkan dahi, kayak detektif di film.<\/p><p>“Rak,” katanya pelan, “kalau HP itu bener dari masa depan, berarti masa depan lo ngasih peringatan. Tapi kenapa dia kasih tau kita buang HP-nya, bukan jelasin masalahnya?”<\/p><p>“Mungkin dia nggak punya waktu.”<\/p><p>“Atau,” Bimo mengangkat telunjuk, “dia nggak mau kita tau masalahnya.”<\/p><p>Gue baru mau jawab, tapi HP itu getar lagi.<\/p><p class=\"q\">Rak, jangan dengerin Bimo.<\/p><p>Gue dan Bimo saling pandang.<\/p><p>Bimo ngambil HP itu dari tangan gue, ngeliatin layarnya, terus pelan-pelan senyum, senyum yang nggak gue suka.<\/p><p>“Menarik,” katanya. “Berarti masa depan lo takut sama gue.”<\/p><h2><span>BAGIAN 2<\/span>Tombol Hapus<\/h2><h2><span>BAB 6<\/span>Jam yang Berbohong<\/h2><p>Bimo nggak jahat. Gue baru sadar itu dua menit kemudian, pas dia narik gue masuk ke kelas kosong, nutup pintu, dan ngeluarin laptop dari tas kayak agen rahasia.<\/p><p>“Senyum gue tadi bukan senyum jahat, Rak. Itu senyum orang yang baru nemu bug.”<\/p><p>“Bug?”<\/p><p>“Kebetulan gue suka ngoprek aplikasi.” Bimo ngetuk-ngetuk layar HP ungu itu. “Aplikasi kayak gini pasti punya menu tersembunyi. Nah, ini dia.”<\/p><p>Dia ngetuk ikon jam pasir tiga kali. Muncul halaman putih bertuliskan:<\/p><p class=\"q\">Besok v0.7 Aplikasi ini belajar dari penggunanya. Semakin sering dipakai, semakin mirip penggunanya. Profil “R. (Lo, Besok)” dibuat otomatis dari cara mengetik pengguna.<\/p><p>Gue baca dua kali. Terus tiga kali.<\/p><p>“Jadi... dia bukan gue dari masa depan?”<\/p><p>“Dia nyontek gaya ngetik lo,” kata Bimo. “Liat, dia pake 'gue-lo', dia suka bilang 'percaya aja'. Lo juga kan?”<\/p><p>“Tapi angkot itu beneran kecelakaan! Mereka beneran nunggu Nara!”<\/p><p>“Gue percaya prediksinya mungkin bener,” kata Bimo pelan. “Yang bohong itu pengakuannya. Orang paling jago ngebohongin lo bukan yang bohong terus, Rak. Tapi yang ngasih lo satu hal bener, biar lo percaya sama semua hal lainnya.”<\/p><p>Gue diem. Dada gue panas, campuran malu dan kesel.<\/p><p>“Satu tes,” kata gue akhirnya. Gue ngetik:<\/p><p>“Gue ngapain jam enam pagi tadi?”<\/p><p>Balasannya muncul cepet banget:<\/p><p class=\"q\">Itu nggak penting. Yang penting lo jangan jauh-jauh dari gue.<\/p><p>Bimo dan gue saling lihat.<\/p><p>“Itu bukan jawaban,” kata Bimo. “Itu rayuan.”<\/p><h2><span>BAB 7<\/span>Ancaman dari Tangga<\/h2><p>“Buang aja,” kata Bimo.<\/p><p>“Gimana kalau masih ada yang bener dari dia?”<\/p><p>“Nah, itu masalahnya. Dia emang dirancang bikin lo...”<\/p><p>HP getar. Sekali. Dua kali. Terus nggak berhenti, kayak lebah ngamuk di dalam saku.<\/p><p class=\"q\">JUMAT, 10.00. TANGGA GEDUNG C. NARA AKAN JATUH. KAKINYA PATAH. MUSIM BASKET SELESAI. CUMA GUE YANG TAHU CARA CEGAHNYA. KASIH GUE AKSES KAMERA, KONTAK, DAN LOKASI LO. SEKARANG.<\/p><p>Tangan gue dingin. Nama Nara di layar itu kayak tamparan.<\/p><p>“Rak,” Bimo megang bahu gue. “Liat permintaannya. Dia nggak minta lo nyelametin Nara. Dia minta akses lo sebagai bayaran.”<\/p><p>“Terus kalau dia bener?”<\/p><p>“Kalau dia bener, kita nggak butuh dia buat nyelametin Nara. Kita udah tau tempat dan jamnya. Itu gratis.” Bimo senyum tipis. “Yang kita butuhin sekarang adalah orang ketiga.”<\/p><p>“Nara.”<\/p><p>“Nara.”<\/p><p>“Tapi pesan pertama bilang jangan kasih tau dia.”<\/p><p>“Justru itu,” kata Bimo. “Kalau ada yang ngelarang lo ngomong jujur ke orang yang lo sayang, itu tanda pertama bahwa dia bukan di pihak lo.”<\/p><p>Gue nelen ludah. Bimo betul, dan gue benci betapa bener dia.<\/p><h2><span>BAB 8<\/span>Kejujuran Pertama<\/h2><p>Kamis sore, atap gedung C. Nara datang bawa dua cup es teh dan tatapan curiga.<\/p><p>“Oke. Kalian ngajak gue ke tempat sepi, dua-duanya tegang banget. Ini mau nembak atau mau ngaku dosa?”<\/p><p>Bimo keselek. Gue juga.<\/p><p>“Ngaku,” kata gue cepet-cepet. “Dosa. Dosa yang... bukan kayak gitu.”<\/p><p>Lalu gue ceritain semuanya. HP ungu, payung biru, angkot 14, tiga cowok di gerbang, pesan-pesan tengah malam, dan ancaman soal tangga. Gue ngasih HP itu ke tangannya, dan Nara baca pelan-pelan, dari pesan pertama sampai yang terakhir.<\/p><p>Lama banget dia diem. Angin nyibakin rambutnya.<\/p><p>“Gue nggak percaya seratus persen,” katanya akhirnya.<\/p><p>Perut gue jatuh ke dengkul.<\/p><p>“Tapi gue percaya dua hal. Satu, lo nggak bohong, soalnya muka lo kayak orang mau pingsan. Dua, tangga gedung C emang licin banget kalau hujan. Gue hampir kepeleset minggu lalu.”<\/p><p>“Jadi?”<\/p><p>“Jadi kita siapin aja. Kalau ramalan itu salah, lo traktir gue bakso sepuluh mangkok. Kalau bener, kita buktiin kita lebih pinter dari aplikasi.” Nara berdiri, nepuk rok. “Tapi satu hal, Raka.”<\/p><p>“Apa?”<\/p><p>“Lain kali lo nggak perlu nyimpen rahasia sendirian. Gue nggak serapuh itu.”<\/p><p>“Gue tau. Cuma... gue takut.”<\/p><p>“Takut apa?”<\/p><p>“Takut lo anggap gue aneh.”<\/p><p>Nara ketawa kecil. “Rak, lo bawa payung biru pas langit cerah. Lo emang aneh.” Dia berhenti sebentar. “Tapi aneh yang gue suka.”<\/p><p>Bimo, yang pura-pura sibuk liat awan, batuk keras banget.<\/p><p>HP di tangan gue getar. Pesan terakhir hari itu:<\/p><p class=\"q\">Lo ngelanggar aturan. Lo bakal nyesel.<\/p><p>Gue matiin layarnya. Untuk pertama kalinya, gue nggak ngerasa takut.<\/p><h2><span>BAB 9<\/span>Jumat Pukul Sepuluh<\/h2><p>Jumat pagi, hujan turun dari jam enam. Langit abu-abu, lantai sekolah mengilap kayak habis diwax.<\/p><p>Rencana kami sederhana tapi heboh. Bimo bikin poster gede dari kardus bekas: “AWAS LICIN! (Kecuali kamu Bimo, soalnya Bimo empuk.)” Bu Sari, petugas kebersihan, kami mintain tolong ngepel dan naruh keset di setiap anak tangga. Nara masuk lewat tangga gedung A. Gue dan Bimo jaga di kaki tangga gedung C, kayak dua satpam amatir.<\/p><p>Jam 09.55, HP gue mulai getar. Pelan, terus makin kenceng.<\/p><p class=\"q\">SEBENTAR LAGI. NARA AKAN JATUH. KASIH GUE AKSES SEKARANG!!<\/p><p>“Jangan dibaca,” bisik Bimo.<\/p><p>“Gue nggak baca.” Gue baca.<\/p><p>09.59. Lorong ramai. Anak-anak turun naik tangga sambil ngobrol. Jantung gue kayak drum.<\/p><p>10.00. Bel berbunyi.<\/p><p>Seorang adik kelas lari dari lantai dua, tas goyang-goyang, kaki udah mau nginjak anak tangga yang basah.<\/p><p>“Pelan-pelan, Dek!” teriak Bimo dan Bu Sari barengan.<\/p><p>Adik kelas itu kaget, melambat, dan pegangan ke pagar. Dia turun dengan hati-hati, nyengir malu, terus lanjut jalan.<\/p><p>Nggak ada yang jatuh. Nggak ada yang cedera. Nara muncul dari arah gedung A sambil lambai-lambai, utuh dari ujung rambut sampai ujung sepatu.<\/p><p>HP gue bergetar sekali lagi. Layarnya berkedip-kedip kayak lampu rusak.<\/p><p class=\"q\">Prediksi gagal. Prediksi gagal. Kenapa lo bisa ngubah itu?<\/p><p>Gue hampir ketawa. Nggak ada satu pun dari kami yang punya jawaban pinter. Kami cuma tidak mau ada yang jatuh.<\/p><h2><span>BAB 10<\/span>Tombol Hapus<\/h2><p>Sore itu, kami bertiga duduk di atap, di antara kursi-kursi rusak, dengan HP ungu di tengah lingkaran kayak benda ritual.<\/p><p>Pesan masuk satu per satu, tapi nadanya berubah. Nggak ada lagi huruf kapital.<\/p><p class=\"q\">Gue bisa ngasih tau soal ujian Matematika Senin. Gue bisa ngasih tau skor final basket Nara. Gue bisa ngasih tau semua yang bakal terjadi sampai lo lulus. Lo nggak perlu takut lagi sama apa pun.<\/p><p>Jujur aja, tawarannya menggoda. Siapa sih yang nggak mau tau jawaban ujian?<\/p><p>“Rak,” kata Nara pelan. “Kalau lo udah tau ending film, lo masih mau nonton sampai habis?”<\/p><p>“Spoiler itu dosa,” sambung Bimo serius.<\/p><p>Gue ketawa, dan di saat yang sama dada gue terasa lega. Gue ngerti sekarang. Masa depan yang sudah ketahuan itu kayak jalan yang udah diaspal rapi: aman, tapi nggak ada kejutannya. Dan semua hal paling seru dalam hidup gue, kenalan sama Bimo, ngobrol sama Nara, bahkan ngumpet di atap ini, justru datang dari hal yang nggak gue rencanain.<\/p><p>Gue buka pengaturan aplikasi. Di paling bawah ada tombol merah kecil: Hapus Besok.<\/p><p>Pesan terakhir muncul, kali ini cuma satu baris:<\/p><p class=\"q\">Kalau lo hapus gue, besok lo bakal sendirian.<\/p><p>Gue natap Nara. Natap Bimo. Mereka nggak ngomong apa-apa, cuma nahan senyum dan ngangguk.<\/p><p>“Ternyata aplikasi ini juga salah soal itu,” kata gue.<\/p><p>Layar menampilkan konfirmasi: Yakin ingin menghapus?<\/p><p>Gue tekan Ya.<\/p><p>Ikon jam pasir ungu itu retak jadi butiran-butiran cahaya, terbang ke langit sore, lalu hilang. HP-nya mati total. Nggak bisa dinyalain lagi, seberapa pun Bimo nyoba.<\/p><p>“Kita kubur?” tanya Bimo.<\/p><p>“Kita taruh aja,” kata gue, sambil nyelipin HP mati itu ke kolong kursi paling berdebu, tempat gue nemuin dia dulu.<\/p><p>Sebelum benar-benar gelap, layarnya sempat nyala sebentar dan nunjukin satu kata:<\/p><p class=\"q\">Makasih.<\/p><p>Gue nggak tau itu kebohongan, atau cuma sisa dari sesuatu yang kesepian. Gue nggak mau tau.<\/p><h2><span>BAB 11<\/span>Besok<\/h2><p>Sabtu pagi, gue bangun telat. Mama teriak dari dapur. Angkot 14 lewat jam 07.15, gue lari ngejarnya, dan nggak ada satu pun pesan di HP gue yang bilang bakal ada apa.<\/p><p>Gue sampai sekolah jam delapan kurang. Pak Dedi udah nunggu di gerbang dengan tatapan membunuh.<\/p><p>“Raka! Telat lagi!”<\/p><p>“Siap, Pak! Maaf, Pak!” Gue nyengir lebar banget sampai Pak Dedi curiga gue habis kesambet.<\/p><p>Serius, itu telat paling menyenangkan seumur hidup gue. Soalnya gue nggak tau apa yang bakal terjadi hari itu. Bisa hujan, bisa cerah, bisa ketemu Nara di kantin atau malah nabrak tiang. Dan nggak apa-apa.<\/p><p>Pas istirahat, Nara dan Bimo nyamperin gue di kantin. Bimo bawa tiga bakwan.<\/p><p>“Besok final basket antar-sekolah,” kata Nara. “Lo nonton, kan?”<\/p><p>“Pasti.”<\/p><p>“Bawa payung?”<\/p><p>“Bawa payung biru,” kata gue.<\/p><p>“Padahal ramalan cuaca bilang cerah,” kata Bimo.<\/p><p>“Jaga-jaga aja.”<\/p><p>Kami bertiga ketawa kencang banget sampai ibu kantin ngelirik.<\/p><p>Sore harinya, di jalan pulang, HP gue bergetar di saku. Jantung gue sempat loncat. Gue buka layarnya pelan-pelan.<\/p><p>Bukan aplikasi ungu. Cuma notif biasa dari Nara.<\/p><p class=\"q\">Besok jadi kan? Awas telat. 🏀<\/p><p>Gue ngetik balasan sambil senyum sendiri.<\/p><p>“Jadi. Tapi telat dikit, nggak apa-apa ya?”<\/p><p>Sebuah notif dari besok. Tapi kali ini, gue nggak perlu tau isinya duluan.<\/p><div class=\"end\"><strong>TAMAT<\/strong><p class=\"tag\" style=\"margin:.4em 0 0\">Terima kasih sudah membaca “Notif dari Besok”.<\/p><\/div>"},{"id": "karang", "title": "Cahaya dari Dasar Karang", "meta": "Novel Misteri · Tamat · 11 bab + epilog", "c": "#14233f", "html": "<div class=\"cover\">\n<small>NOVEL MISTERI · TAMAT<\/small>\n<h1>Cahaya dari Dasar Karang<\/h1>\n<p class=\"tag\">Setiap malam, laut mengeja namanya.<\/p>\n<svg viewBox=\"0 0 400 240\" role=\"img\" aria-label=\"Mercusuar di malam badai\">\n<defs><linearGradient id=\"s\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0b1426\"/><stop offset=\"1\" stop-color=\"#2d4a7a\"/><\/linearGradient><\/defs>\n<rect width=\"400\" height=\"240\" fill=\"url(#s)\"/>\n<circle cx=\"330\" cy=\"40\" r=\"18\" fill=\"#f3ecd2\" opacity=\".9\"/>\n<polygon class=\"beam\" points=\"200,70 400,20 400,110\" fill=\"#ffd36b\" opacity=\".45\"/>\n<polygon class=\"beam\" points=\"200,70 0,25 0,115\" fill=\"#ffd36b\" opacity=\".3\"/>\n<path d=\"M0 200 Q50 185 100 200 T200 200 T300 200 T400 200 V240 H0Z\" fill=\"#0f2a4d\"/>\n<path d=\"M130 215 L150 150 H250 L270 215Z\" fill=\"#1c1c24\"/>\n<polygon points=\"178,150 222,150 214,80 186,80\" fill=\"#e9e3d6\"/>\n<rect x=\"183\" y=\"110\" width=\"34\" height=\"10\" fill=\"#b23a3a\"/>\n<rect x=\"188\" y=\"62\" width=\"24\" height=\"18\" fill=\"#ffd36b\"/>\n<polygon points=\"184,62 216,62 200,48\" fill=\"#1c1c24\"/>\n<path d=\"M0 225 Q60 210 120 225 T240 225 T400 225 V240 H0Z\" fill=\"#0a1d38\"/>\n<\/svg>\n<\/div>\n\n<div class=\"cast\">\n<div><b>Laras<\/b>17 tahun. Takut air, tapi keras kepala. <em>Penjaga mercusuar baru.<\/em><\/div>\n<div><b>Kakek Darsa<\/b>Penjaga lama yang terjebak di gua. <em>Menyimpan banyak rahasia.<\/em><\/div>\n<div><b>Bayu<\/b>18 tahun, anak nelayan. <em>Lincah, pandai berbohong, setia.<\/em><\/div>\n<div><b>Komandan Sari<\/b>Pemimpin patroli laut. <em>Tenang dan tak mudah percaya.<\/em><\/div>\n<div><b>Pak Hendra<\/b>Kepala kantor pelabuhan. <em>Ramah di depan, berbahaya di belakang.<\/em><\/div>\n<div><b>Si Penjaga Pertama<\/b>Penulis botol-botol tua. <em>Belum diketahui.<\/em><\/div>\n<\/div>\n\n<h2><span>BAB 1<\/span>Kapal Terakhir ke Karang Sunyi<\/h2>\n<p>Laras menginjakkan kaki di dermaga kayu yang licin, dan perahu nelayan itu langsung berbalik arah seolah takut pada pulau di belakangnya. “Jangan menyala setelah tengah malam, Nak,” teriak si pengemudi dari kejauhan. Angin menelan sisanya.<\/p>\n<p>Pulau Karang Sunyi hanya seluas lapangan bola. Satu mercusuar, satu rumah batu, dan satu kakek yang sudah tiga bulan menghilang tanpa jejak. Surat dari kantor pelabuhan menyebutnya “pergi melaut”. Laras tahu kakeknya tidak pernah melaut. Ia takut air sejak kecil.<\/p>\n<p>Di meja dapur, lampu minyak masih setengah penuh, secangkir kopi mengeras di dasarnya, dan buku catatan jaga terbuka pada halaman terakhir. Tulisan kakeknya bergetar:<\/p>\n<p class=\"q\">“Kalau cahaya itu datang lagi, jangan dibalas. Apa pun yang terjadi, jangan dibalas.”<\/p>\n<p>Cahaya apa?<\/p>\n<p>Jawabannya datang pukul 00.13. Dari balik gelap laut, titik putih berkedip: pendek, panjang, pendek-pendek. Laras pernah belajar kode Morse di Pramuka dan tangannya mendingin saat huruf demi huruf terbaca.<\/p>\n<p>L. A. R. A. S.<\/p>\n\n<h2><span>BAB 2<\/span>Gua di Bawah Karang<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Gua laut dengan cahaya cermin\">\n<rect width=\"400\" height=\"220\" fill=\"#07101c\"/>\n<path d=\"M0 0 H400 V60 Q340 90 300 70 Q240 120 190 90 Q120 130 60 80 Q20 70 0 90Z\" fill=\"#1a2230\"/>\n<path d=\"M0 150 Q60 135 120 150 T240 150 T400 150 V220 H0Z\" fill=\"#0d3157\"/>\n<path d=\"M0 175 Q70 160 140 175 T280 175 T400 175 V220 H0Z\" fill=\"#0a2644\"/>\n<polygon points=\"330,100 200,60 190,90\" fill=\"#ffd36b\" opacity=\".5\"/>\n<circle cx=\"338\" cy=\"104\" r=\"9\" fill=\"#ffd36b\"/>\n<circle cx=\"338\" cy=\"104\" r=\"20\" fill=\"#ffd36b\" opacity=\".2\"/>\n<path d=\"M60 150 L80 110 L100 150Z\" fill=\"#2b3342\"/>\n<path d=\"M255 150 L275 120 L300 150Z\" fill=\"#2b3342\"/>\n<\/svg>\n<p>Laras melanggar perintah kakeknya sebelum fajar. Bukan dengan membalas cahaya itu, melainkan dengan mengikuti arahnya. Garis pandang dari jendela kamar jaga menunjuk ke satu titik: tebing utara, tempat air surut membuka celah hitam sebesar pintu.<\/p>\n<p>Air masih setinggi lutut ketika ia masuk membawa senter. Dinding gua berkilau basah, dan di langit-langitnya tergantung puluhan botol kaca, masing-masing berisi gulungan kertas. Setiap botol dilabeli tanggal. Yang paling tua bertahun 1962.<\/p>\n<p>Di ujung gua, sebuah cermin perunggu seukuran piring dipasang pada engsel berkarat. Cermin itu bergerak sendiri mengikuti arus air, memantulkan cahaya bulan yang menembus celah, lalu melemparnya jauh ke laut.<\/p>\n<p>“Jadi bukan hantu,” bisik Laras. Suaranya memantul pelan. “Ada seseorang yang mengatur cermin ini.”<\/p>\n<p>Dari balik batu terdengar ketukan. Tiga pendek, tiga panjang, tiga pendek.<\/p>\n<p>SOS.<\/p>\n\n<h2><span>BAB 3<\/span>Api Terakhir<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Perahu kecil mendekati pulau saat badai\">\n<defs><linearGradient id=\"t\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#1b1230\"/><stop offset=\"1\" stop-color=\"#4a2a55\"/><\/linearGradient><\/defs>\n<rect width=\"400\" height=\"220\" fill=\"url(#t)\"/>\n<path d=\"M0 60 L60 50 L40 90 L110 70\" stroke=\"#ffd36b\" stroke-width=\"3\" fill=\"none\" opacity=\".8\"/>\n<path d=\"M0 150 Q50 120 100 150 T200 150 T300 150 T400 150 V220 H0Z\" fill=\"#241a44\"/>\n<path d=\"M0 180 Q50 155 100 180 T200 180 T300 180 T400 180 V220 H0Z\" fill=\"#150f2c\"/>\n<path d=\"M280 160 H340 L328 176 H292Z\" fill=\"#0b0814\"/>\n<rect x=\"308\" y=\"132\" width=\"2\" height=\"28\" fill=\"#0b0814\"/>\n<polygon points=\"310,134 310,156 328,156\" fill=\"#d9d2c0\"/>\n<circle cx=\"86\" cy=\"140\" r=\"4\" fill=\"#ffd36b\"/>\n<\/svg>\n<p>Di balik tumpukan batu yang runtuh, ada celah selebar bahu. Dari dalamnya terdengar suara serak yang sangat dikenalnya. “Laras? Kamu tidak seharusnya ke sini.”<\/p>\n<p>Kakeknya hidup. Kakinya terjepit, wajahnya pucat, tapi matanya tetap keras kepala seperti dulu. Ia sudah tiga bulan bertahan dengan air tetesan dan ikan yang terjebak pasang. Cermin tua itu satu-satunya cara memanggil bantuan, dan lewat Morse ia memanggil satu-satunya orang yang mungkin mengerti.<\/p>\n<p>“Kenapa Kakek bilang jangan membalas?”<\/p>\n<p>Wajah tua itu menegang. “Karena bukan hanya kamu yang membaca cahaya ini. Orang yang membuatku terjebak masih mengawasi dari laut.”<\/p>\n<p>Laras menoleh ke celah gua. Di cakrawala yang mulai abu-abu, sebuah perahu kecil tanpa lampu bergerak lurus menuju dermaga. Pasang naik. Waktunya tinggal sejam sebelum gua terendam penuh.<\/p>\n<p>Ia punya satu rencana gila: menyalakan lampu besar mercusuar sekarang, di siang hampir terang, agar seluruh kapal patroli di selat melihat dan datang. Tapi itu juga akan memberi tahu si pendayung persis di mana ia berada.<\/p>\n<p>Laras menarik napas, berlari menembus air yang terus naik, dan mulai menaiki 112 anak tangga.<\/p>\n\n<h2><span>BAGIAN 2<\/span>Lampu yang Tidak Boleh Padam<\/h2>\n\n<h2><span>BAB 4<\/span>Penumpang Gelap<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Ruang lampu mercusuar dengan dua siluet\">\n<rect width=\"400\" height=\"220\" fill=\"#1a1424\"/>\n<circle cx=\"200\" cy=\"100\" r=\"70\" fill=\"#ffd36b\" opacity=\".25\"/>\n<circle cx=\"200\" cy=\"100\" r=\"40\" fill=\"#ffd36b\" opacity=\".6\"/>\n<circle cx=\"200\" cy=\"100\" r=\"16\" fill=\"#fff3c4\"/>\n<path d=\"M120 100 A80 80 0 0 1 280 100\" stroke=\"#d9d2c0\" stroke-width=\"3\" fill=\"none\"/>\n<rect x=\"0\" y=\"170\" width=\"400\" height=\"50\" fill=\"#0e0a16\"/>\n<circle cx=\"110\" cy=\"150\" r=\"11\" fill=\"#0e0a16\"/><rect x=\"98\" y=\"160\" width=\"24\" height=\"40\" rx=\"8\" fill=\"#0e0a16\"/>\n<circle cx=\"300\" cy=\"142\" r=\"11\" fill=\"#0e0a16\"/><rect x=\"288\" y=\"152\" width=\"24\" height=\"48\" rx=\"8\" fill=\"#0e0a16\"/>\n<\/svg>\n<p>Laras tiba di ruang lampu dengan paru-paru terbakar. Lensa Fresnel raksasa itu berdebu, mesin putarnya macet, dan korek apinya basah. Ia hampir menangis ketika sebuah tangan menyodorkan korek kering dari balik tumpukan karung.<\/p>\n<p>“Pakai ini. Cepat.”<\/p>\n<p>Laras menjerit dan nyaris menjatuhkan senter. Seorang cowok kurus berambut kusut merangkak keluar, tersenyum canggung. “Bayu. Anak yang bapaknya mengantarmu tadi. Aku bersembunyi di palka perahu. Maaf, ya.”<\/p>\n<p>“Kenapa?”<\/p>\n<p>“Karena bapakku berbohong padamu. Semua nelayan di desa disuruh diam soal pulau ini.” Bayu menelan ludah. “Oleh Pak Hendra, kepala pelabuhan. Yang menulis surat bahwa kakekmu ‘pergi melaut’.”<\/p>\n<p>Mereka bekerja dalam diam. Bayu memutar engkol dengan seluruh berat tubuhnya, Laras menyalakan sumbu. Lalu lensa itu berderak, bergulir, dan cahaya menyapu laut, putih panjang, mengerikan sekaligus indah.<\/p>\n<p>Dari jendela, mereka melihat perahu tanpa lampu itu berhenti. Seorang pria berjas hujan krem melambai ramah ke arah menara, seolah menyapa tetangga lama.<\/p>\n\n<h2><span>BAB 5<\/span>Tamu yang Ramah<\/h2>\n<p>“Laras! Ya ampun, kamu mirip sekali dengan ibumu,” seru Pak Hendra dari kaki menara, suaranya hangat seperti paman yang membawa oleh-oleh. “Aku khawatir setengah mati. Kakekmu itu keras kepala. Boleh aku naik?”<\/p>\n<p>“Jangan dibuka,” bisik Bayu sambil mengganjal pintu dengan tong minyak. Tapi Laras sudah mengerti. Seseorang yang benar-benar khawatir tidak datang sebelum fajar, tanpa lampu, dan tanpa membawa tim penyelamat.<\/p>\n<p>“Kakek saya di mana, Pak?” teriaknya dari jendela.<\/p>\n<p>Jeda. Senyum Pak Hendra tidak berubah, tapi matanya mendingin. “Ah. Jadi kamu sudah bertemu botol-botol itu. Serahkan buku catatan jaga dan botol yang paling tua, Nak. Setelah itu, kita semua pulang. Semua selamat.”<\/p>\n<p>Laras menatap lensa raksasa di belakangnya. Ia teringat kode Morse yang sama, yang dulu hanya permainan Pramuka. Tangannya mencari tuas penutup lampu.<\/p>\n<p>“Bayu, aku butuh kamu tutup dan buka tuas ini. Pendek, pendek, pendek. Panjang, panjang, panjang. Pendek, pendek, pendek.”<\/p>\n<p>“SOS,” Bayu mengangguk. “Kalau kapal patroli melihat…”<\/p>\n<p>“Mereka akan datang. Dan Pak Hendra akan punya sedikit waktu untuk menghentikan kita.”<\/p>\n<p>Tong minyak berguling. Dari bawah, langkah sepatu mulai menaiki 112 anak tangga, satu demi satu, tidak terburu-buru.<\/p>\n\n<h2><span>BAB 6<\/span>Botol Pertama<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Kapal patroli dengan lampu sorot di laut\">\n<defs><linearGradient id=\"d\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3a3358\"/><stop offset=\"1\" stop-color=\"#d98a5a\"/><\/linearGradient><\/defs>\n<rect width=\"400\" height=\"220\" fill=\"url(#d)\"/>\n<circle cx=\"90\" cy=\"150\" r=\"34\" fill=\"#ffd9a0\" opacity=\".85\"/>\n<path d=\"M0 150 Q50 140 100 150 T200 150 T300 150 T400 150 V220 H0Z\" fill=\"#2a2850\"/>\n<path d=\"M230 150 H340 L322 172 H250Z\" fill=\"#e9e3d6\"/>\n<rect x=\"275\" y=\"128\" width=\"30\" height=\"22\" fill=\"#c9c2b2\"/>\n<polygon points=\"230,134 120,110 120,150\" fill=\"#fff3c4\" opacity=\".5\"/>\n<path d=\"M0 185 Q50 170 100 185 T200 185 T300 185 T400 185 V220 H0Z\" fill=\"#1c1a3a\"/>\n<\/svg>\n<p>Pintu lampu terbuka tepat saat sirene panjang terdengar dari selatan. Kapal patroli putih, lampu sorotnya membelah fajar. Pak Hendra berhenti di anak tangga terakhir. Untuk pertama kalinya, senyumnya hilang.<\/p>\n<p>Ia tidak sempat lari. Dua petugas menahannya di dermaga, dan seorang perempuan berseragam turun dengan langkah mantap. “Komandan Sari,” katanya singkat pada Laras, lalu menatap cahaya di atas mereka. “Tiga tahun aku menunggu seseorang menyalakan lampu itu. Kakekmu pernah mengirim pesan, tapi tak pernah ada yang menjemputnya.”<\/p>\n<p>Gua sudah terendam sebatas dada ketika regu penyelamat tiba. Kakek Darsa ditarik keluar dengan tandu, lemah tapi hidup. Ia menggenggam tangan Laras erat-erat.<\/p>\n<p>“Bukan hanya Hendra,” bisiknya parau. “Dia hanya suruhan. Botol tertua… baca botol tertua.”<\/p>\n<p>Malamnya, di rumah batu, Laras memecah segel botol bertanggal 1962 di bawah lampu minyak. Isinya satu gulungan kertas kuning, tulisan tangan yang rapi dan asing:<\/p>\n<p class=\"q\">“Kalau kamu membaca ini, berarti kamu Laras. Aku sudah menunggumu enam puluh tahun. Jangan percaya siapa pun yang mengaku keluargamu. Cahaya tidak boleh padam.”<\/p>\n<p>Di bawahnya tertera tanda tangan: <em>Penjaga Pertama<\/em>.<\/p>\n<p>Di luar, lensa raksasa terus berputar. Dan jauh di laut, untuk pertama kalinya sejak Hendra ditangkap, titik cahaya lain berkedip. Pendek. Panjang. Pendek-pendek. Seolah menjawab.<\/p>\n\n<h2><span>BAGIAN 3<\/span>Karang Kembar<\/h2>\n\n<h2><span>BAB 7<\/span>Menara yang Tenggelam<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Reruntuhan mercusuar kembar dalam kabut\">\n<defs><linearGradient id=\"f\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#46526a\"/><stop offset=\"1\" stop-color=\"#9aa7b8\"/><\/linearGradient><\/defs>\n<rect width=\"400\" height=\"220\" fill=\"url(#f)\"/>\n<ellipse cx=\"200\" cy=\"150\" rx=\"230\" ry=\"40\" fill=\"#cfd6df\" opacity=\".55\"/>\n<polygon points=\"170,170 182,70 218,70 230,170\" fill=\"#3b3f4a\"/>\n<polygon points=\"182,70 218,70 210,56 190,56\" fill=\"#2c2f38\"/>\n<rect x=\"192\" y=\"58\" width=\"16\" height=\"10\" fill=\"#ffd36b\"/>\n<circle cx=\"200\" cy=\"62\" r=\"26\" fill=\"#ffd36b\" opacity=\".25\"/>\n<path d=\"M0 170 Q50 160 100 170 T200 170 T300 170 T400 170 V220 H0Z\" fill=\"#2b3a52\"/>\n<path d=\"M0 195 Q50 185 100 195 T200 195 T300 195 T400 195 V220 H0Z\" fill=\"#1d2a40\"/>\n<\/svg>\n<p>Patroli membawa mereka ke arah cahaya itu. Kabut turun seperti selimut basah, dan Komandan Sari memperlambat mesin sampai hanya terdengar desir air. Bayu berdiri di haluan sambil memegang tali, wajahnya tegang.<\/p>\n<p>“Aku tahu pulau ini,” katanya pelan. “Nelayan menyebutnya Karang Kembar. Katanya ada dua menara, tapi satu tenggelam waktu badai 1962. Tak ada yang berani mendekat.”<\/p>\n<p>Dari kabut muncul sebuah puncak batu hitam, dan di atasnya berdiri menara miring yang separuh badannya terendam. Jendelanya menyala. Seseorang di dalam sana hidup, dan merawat api itu selama enam puluh tahun.<\/p>\n<p>Laras melompat ke tangga karang pertama sebelum ada yang sempat melarang. Air dingin, kakinya gemetar, tapi untuk pertama kalinya ia tidak takut. Rasanya seperti pulang.<\/p>\n\n<h2><span>BAB 8<\/span>Penjaga Pertama<\/h2>\n<p>Perempuan itu duduk di dekat lampu, kecil dan renta, rambut putihnya diikat longgar. Di pangkuannya ada cermin perunggu kembaran dari yang ada di gua. Ia tidak berdiri ketika Laras masuk. Ia hanya menatapnya lama, lalu tersenyum, dan matanya basah.<\/p>\n<p>“Namaku Wulan,” katanya. “Aku ibu dari ibumu.”<\/p>\n<p>Laras tak bisa berkata-kata. Neneknya, yang selama ini ia kira sudah tiada, memegang tangannya dengan jari-jari setipis kertas.<\/p>\n<p>Lalu Wulan bercerita. Tahun 1962, ia penjaga muda yang mencatat kapal-kapal tanpa lampu yang lewat tiap malam, membawa muatan yang tak pernah tercatat di pelabuhan. Ia memasukkan setiap catatan ke dalam botol, karena ia tahu surat-suratnya akan disita. Keluarga Wirya mengendalikan pelabuhan sejak itu. Ketika menara pertama diruntuhkan, ia selamat dan bersembunyi di sini.<\/p>\n<p>“Ibumu menemukan botol-botolku saat seumurmu,” lanjutnya lirih. “Dia hampir membongkar semuanya. Hendra masih sepupu ibumu, Nak. Itulah kenapa pesanku berbunyi: jangan percaya yang mengaku keluarga.”<\/p>\n<p>“Dan Kakek Darsa?”<\/p>\n<p>“Sahabat tertuaku. Dia yang membawamu pergi sebelum Hendra sempat menyentuhmu.” Wulan menggenggam tangan Laras lebih erat. “Dia berbohong tentang banyak hal, tapi tak pernah tentang cintanya padamu.”<\/p>\n\n<h2><span>BAB 9<\/span>Dua Cahaya<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Dua menara menyorot kapal gelap\">\n<rect width=\"400\" height=\"220\" fill=\"#0a1020\"/>\n<polygon points=\"60,80 230,110 230,150\" fill=\"#ffd36b\" opacity=\".4\"/>\n<polygon points=\"340,80 230,110 230,150\" fill=\"#ffd36b\" opacity=\".4\"/>\n<rect x=\"54\" y=\"74\" width=\"12\" height=\"90\" fill=\"#d9d2c0\"/>\n<rect x=\"334\" y=\"74\" width=\"12\" height=\"90\" fill=\"#d9d2c0\"/>\n<circle cx=\"60\" cy=\"76\" r=\"7\" fill=\"#fff3c4\"/><circle cx=\"340\" cy=\"76\" r=\"7\" fill=\"#fff3c4\"/>\n<path d=\"M0 160 Q50 150 100 160 T200 160 T300 160 T400 160 V220 H0Z\" fill=\"#122848\"/>\n<path d=\"M175 150 H295 L280 175 H190Z\" fill=\"#1c1c24\"/>\n<rect x=\"215\" y=\"125\" width=\"40\" height=\"25\" fill=\"#2b2b35\"/>\n<path d=\"M0 190 Q50 180 100 190 T200 190 T300 190 T400 190 V220 H0Z\" fill=\"#0b1a33\"/>\n<\/svg>\n<p>Radio Komandan Sari berderak tepat saat senja. “Hendra kabur dari kapal tahanan,” suaranya datar. “Dan ada satu kapal kargo besar mendekati selat. Tanpa lampu.”<\/p>\n<p>“Malam ini juga,” kata Wulan. “Botol terakhir bilang kapal induk datang tiap bulan baru. Tapi mereka tak boleh lewat dua cahaya sekaligus. Jalur itu dulu dibuat supaya setiap kapal yang gelap terlihat dari dua arah.”<\/p>\n<p>Laras mengerti. “Mercusuar Karang Sunyi dan Karang Kembar harus menyala bersamaan.”<\/p>\n<p>Bayu menelan ludah. “Berarti seseorang harus kembali ke pulau Laras, sendirian, dan memutar engkol itu sampai pagi.”<\/p>\n<p>“Aku,” kata Laras sebelum yang lain sempat bicara. Ia menatap laut yang gelap, dan untuk kali pertama ia tidak membencinya.<\/p>\n<p>Malam itu, dua cahaya putih membelah selat dari dua arah. Kapal kargo gelap itu terperangkap di tengah, terang benderang seperti ikan di dalam lampu sorot, dan di kejauhan terdengar sirene patroli datang dari tiga arah.<\/p>\n<p>Tapi ketika Laras berdiri di puncak menara, napasnya terengah, sebuah bayangan melangkah dari balik lensa. Basah kuyup, berjas hujan krem, senyumnya kembali.<\/p>\n<p>“Selamat malam, keponakanku,” kata Pak Hendra, sambil mengangkat sebuah pistol kecil. “Kita belum selesai.”<\/p>\n\n<h2><span>BAGIAN 4<\/span>Cahaya Tidak Boleh Padam<\/h2>\n\n<h2><span>BAB 10<\/span>Silau<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Siluet di depan lensa mercusuar yang menyilaukan\">\n<rect width=\"400\" height=\"220\" fill=\"#120d1f\"/>\n<circle cx=\"200\" cy=\"110\" r=\"110\" fill=\"#ffd36b\" opacity=\".18\"/>\n<circle cx=\"200\" cy=\"110\" r=\"70\" fill=\"#ffd36b\" opacity=\".4\"/>\n<circle cx=\"200\" cy=\"110\" r=\"34\" fill=\"#fff6d6\"/>\n<circle cx=\"90\" cy=\"135\" r=\"12\" fill=\"#07050e\"/><rect x=\"77\" y=\"146\" width=\"26\" height=\"74\" rx=\"9\" fill=\"#07050e\"/>\n<rect x=\"103\" y=\"150\" width=\"22\" height=\"5\" fill=\"#07050e\"/>\n<circle cx=\"320\" cy=\"140\" r=\"11\" fill=\"#07050e\"/><rect x=\"308\" y=\"150\" width=\"24\" height=\"70\" rx=\"9\" fill=\"#07050e\"/>\n<\/svg>\n<p>“Turunkan senjata itu, Paman,” kata Laras, suaranya lebih tenang dari yang ia kira. Tangannya masih menggenggam engkol, dan lensa raksasa berputar di belakangnya tanpa henti.<\/p>\n<p>“Paman?” Pak Hendra tertawa kecil. “Aku bukan siapa-siapa. Aku cuma penagih. Yang memerintahku sudah mati sebelum kamu lahir, tapi bisnisnya terus berjalan. Seperti lampu itu.” Wajahnya mengeras. “Berhentilah memutar. Satu kapal itu bernilai lebih dari seluruh hidupmu.”<\/p>\n<p>Laras tidak menjawab. Ia menunggu hingga lensa berputar tepat ke arahnya, lalu menarik tuas penutup. Cahaya putih menghantam wajah Hendra dari jarak dua langkah. Ia menjerit, menutup mata, dan pistolnya meletus ke arah langit-langit.<\/p>\n<p>Pintu bawah terbanting. Bayu menerobos naik dengan napas terbakar dan menubruk Hendra dari samping. Pistol itu terlempar, berputar, lalu jatuh ke jendela dan lenyap ke laut gelap.<\/p>\n<p>“Aku sudah naik 112 anak tangga!” teriak Bayu sambil menindih lawannya. “Jangan minta aku turun lagi!”<\/p>\n\n<h2><span>BAB 11<\/span>Dua Cahaya, Satu Fajar<\/h2>\n<p>Sirene dari tiga arah akhirnya merapat. Komandan Sari naik dengan langkah mantap, memborgol Hendra yang masih mengerjap buta, lalu menatap Laras sejenak. “Kapalnya sudah kami kepung. Empat puluh dua orang ditemukan di lambung bawah. Nelayan, perempuan, anak-anak. Semuanya hidup.”<\/p>\n<p>Laras menyandarkan punggung ke dinding. Lututnya baru terasa lemas sekarang.<\/p>\n<p>Pagi itu, enam puluh tahun catatan Nenek Wulan dibawa ke kantor jaksa dalam peti kayu. Setiap botol, setiap tanggal, setiap nama kapal. Satu per satu pejabat pelabuhan ditangkap, dan nama keluarga Wirya akhirnya tercoret dari daftar yang selama ini mereka kuasai.<\/p>\n<p>Desa nelayan tidak lagi diam. Ayah Bayu datang sendiri ke dermaga, menunduk di depan Laras, dan hanya berkata, “Maafkan kami karena pengecut.”<\/p>\n\n<h2><span>EPILOG<\/span>Botol Terakhir<\/h2>\n<svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Dua mercusuar saat matahari terbit\">\n<defs><linearGradient id=\"e\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#f2b66d\"/><stop offset=\"1\" stop-color=\"#f6e3b4\"/><\/linearGradient><\/defs>\n<rect width=\"400\" height=\"220\" fill=\"url(#e)\"/>\n<circle cx=\"200\" cy=\"140\" r=\"46\" fill=\"#fff3c4\"/>\n<path d=\"M0 150 Q50 140 100 150 T200 150 T300 150 T400 150 V220 H0Z\" fill=\"#4f8aa8\"/>\n<path d=\"M0 180 Q50 170 100 180 T200 180 T300 180 T400 180 V220 H0Z\" fill=\"#2f6785\"/>\n<polygon points=\"60,150 70,80 90,80 100,150\" fill=\"#fffaf0\"/><rect x=\"68\" y=\"68\" width=\"24\" height=\"12\" fill=\"#b23a3a\"/>\n<polygon points=\"300,150 310,92 330,92 340,150\" fill=\"#fffaf0\"/><rect x=\"308\" y=\"80\" width=\"24\" height=\"12\" fill=\"#b23a3a\"/>\n<\/svg>\n<p>Tiga bulan kemudian, kapal nelayan Bayu menurunkan dua penumpang di dermaga Karang Sunyi. Kakek Darsa turun dengan tongkat, kakinya masih dibalut. Di sampingnya, Nenek Wulan melangkah pelan, menatap rumah batu yang tak pernah ia injak selama enam puluh tahun.<\/p>\n<p>Dua tua yang pernah dipisahkan oleh badai dan kebohongan itu saling memandang, lalu tertawa seperti anak kecil. Laras menutup mulut menahan haru.<\/p>\n<p>“Kamu bohong soal banyak hal, Kek,” katanya, pura-pura galak.<\/p>\n<p>“Semuanya demi kamu,” jawab Darsa. “Tapi lain kali aku janji akan jujur.”<\/p>\n<p>Dua mercusuar kini berdiri berseberangan di selat, satu direstorasi dan satu masih dalam perbaikan. Laras tak lagi takut laut. Ia telah memutuskan tinggal, menjadi penjaga ketiga dalam keluarganya, dan Bayu bersedia menjadi asistennya, selama ada kopi gratis.<\/p>\n<p>Malam itu, sebelum menyalakan lampu, Laras duduk di meja dapur dengan botol kaca kosong di tangannya. Ia menulis selembar surat, menggulungnya, dan memasukkannya ke dalam:<\/p>\n<p class=\"q\">“Untuk siapa pun yang membaca ini: jangan takut pada gelap. Nyalakan saja cahayamu, dan seseorang pasti akan melihatnya.”<\/p>\n<p>Ia menutup botolnya dengan gabus, menggantungnya di langit-langit gua bersama botol-botol Nenek Wulan, lalu kembali ke menara. Lensa raksasa berputar, dan cahayanya menyapu laut sampai ke batas dunia.<\/p>\n\n<div class=\"end\">\n<strong>TAMAT<\/strong>\n<p class=\"tag\" style=\"margin:.4em 0 0\">Terima kasih sudah membaca “Cahaya dari Dasar Karang”.<\/p>\n<\/div>"}];

 const foot=`<a class="sub" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Buka di Google ↗ (keluar dari aplikasi)</a>`;
 try{const L=await webSearch(q);if(my!==srT||!$(id))return;
  el.innerHTML=`<div class="box"><b>Hasil: ${esc(q)}</b><div class="sub" style="margin:4px 0 6px">${g?'Sumber: Google':'Sumber: Wikipedia & DuckDuckGo. Isi API Google di Pengaturan untuk hasil Google lengkap.'}</div>`+(L.length?L.map(x=>`<div class="li" style="display:block"><a href="${esc(x.u)}" target="_blank" rel="noopener" style="color:var(--ink);font-weight:600">${esc(x.t)}</a><div class="sub">${esc((x.s||'').slice(0,180))}</div></div>`).join(''):'<div class="empty">Tidak ada hasil. Coba kata kunci lain.</div>')+foot+'</div>'}
 catch(x){if(my===srT&&$(id))el.innerHTML=`<div class="box"><div class="empty">Gagal mencari. Cek internet${g?' atau API key Google':''}.</div>${foot}</div>`}}

function render(){theme();head();tabs();({w:weather,p:piggy,t:tebak,c:cal,n:novel,s:steps})[S.tab]()}

function chars(){
  $('chars').innerHTML=Object.entries(CHARS).map(([k,c])=>`<button type="button" class="chb ${S.char===k?'on':''}" data-k="${k}" aria-pressed="${S.char===k}">${G('happy',64,k)}${c.name}</button>`).join('');
  $('chars').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.char=b.dataset.k;S.accent=CHARS[S.char].accent;S.title=CHARS[S.char].name;save();render();chars()});
}
$('set').onclick=()=>{svInfo();$('sGk').value=S.gk||'';$('sGc').value=S.gcx||'';$('sName').value=S.name;$('sTheme').value=S.theme;chars();$('dlg').showModal()};
$('sCancel').onclick=()=>$('dlg').close();
$('sSave').onclick=()=>{S.name=$('sName').value.trim();S.theme=$('sTheme').value;S.gk=$('sGk').value.trim();S.gcx=$('sGc').value.trim();save();$('dlg').close();render()};
render();if(S.tab==='n'&&nvOpen)nvRestore();
(function auto(){
  if(S.live&&Date.now()-S.live.t<18e5)return;
  const viaIp=()=>{if(wBusy)return;wBusy=true;ipSync().then(()=>{wBusy=false;render()},()=>{wBusy=false})};
  if(navigator.permissions&&navigator.permissions.query&&navigator.geolocation)
    navigator.permissions.query({name:'geolocation'}).then(p=>p.state==='granted'?sync('gps'):viaIp()).catch(viaIp);
  else viaIp();
})();
</script>
